/**:
  ros__parameters:
    sub_topic: "/nautilus/color/image_rect"
    pub_topic: "/filtered_image"
    input_encoding: "rgb8"
    output_encoding: "rgb8"

    filter_params:
      filter_type: "remove_grid"
      flip:
        flip_code: 1
      unsharpening:
        blur_size: 8
      erosion:
        size: 1
      dilation:
        size: 3
      white_balancing:
        contrast_percentage: 10.0
      gray_world:
        max_gain: 4.0  # caps per-channel gain to [1/max_gain, max_gain]; guards against black/white flicker
      shades_of_gray:
        norm_p: 6.0  # 1 = gray-world, larger -> white-patch; 6 is a robust sweet spot
        max_gain: 4.0
      white_patch:
        percentile: 0.97  # [0, 1] channel white reference; <1 is robust to noise
        max_gain: 4.0
      underwater_compensation:
        alpha: 1.0  # strength of green->red(/blue) reconstruction (1.0 = Ancuti 2018)
        compensate_blue: false  # also reconstruct blue (deeper / very blue water)
        max_gain: 4.0
      fixed_gain:  # constant, scene-independent per-channel gains (calibrate once)
        gain_r: 1.8  # red is most attenuated underwater -> boost most
        gain_g: 1.0
        gain_b: 1.2
        offset: 0.0  # constant added to every channel, in 8-bit units
      clahe:
        clip_limit: 2.0  # higher -> more contrast (and more noise)
        tile_grid_size: 8  # image split into tile_grid_size x tile_grid_size tiles
      ebus:
        erosion_size: 2
        blur_size: 30
        mask_weight: 5
      otsu:
        gsc_weight_r: 1.0  # Grayscale red weight
        gsc_weight_g: 0.0  # Grayscale green weight
        gsc_weight_b: 0.0   # Grayscale blue weight
        gamma_auto_correction: true
        gamma_auto_correction_weight: 4.0
        otsu_segmentation: true
        erosion_size: 2
        dilation_size: 2
      remove_grid:
        inpaint_radius: 1.0 # Increase when it get blurry close
        threshold_binary: 90 # Adjust depending on how many black patches obstructs around the marker
        use_binary_threshold: true
        rotation: 0
        height: 400
        width: 400
        hsv_hue_low: 9 # This value is calibrated for yellow-green grids. Increase this value to ~40 if the grid is more orange
        hsv_hue_high: 40 # Increase this value to ~80 if more orange
        hsv_sat_low: 50 # Adjust together with hsv_val_high depending on brightness
        hsv_sat_high: 255
        hsv_val_low: 50 # Adjust together with hsv_sat_low depending on brightness
        hsv_val_high: 255
        hsv_tuning: true # When true, optimal values for the filter will be written to a file
        attempts: 10 # The increments each hsv-threshold increases with for each loop (tuning)
      overlap:
        percentage_threshold: 20.0 # Percentage (0-100) to cap the pixel intensity difference
      median_binary: # finds the median of each n x n square around each pixel
        kernel_size: 3 # must be odd > 1
        threshold: 100 # [0, 255]
        invert: false
      binary:
        threshold: 20. # in percent
        maxval: 255.
        invert: true
      temporal_noise:
        median_kernel_size: 3
        power_law_weight: 4.0 # Weight for the gamma function
        erotion_size: 2
        dilation_size: 4
        canny_high: 90 # upper weight for canny edge detection
        canny_low: 30 # lower weight  ---------- || ----------
        edge_protection_radius: 2 # Radius for protecting edges
